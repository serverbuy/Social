name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Komplette App inkl. Datenbank für den Offline-Betrieb im Handy bauen
      - name: Offline-Web-App bauen
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npx vite build -c vite.offline.config.ts
          rm -rf android-app/app/src/main/assets/www
          mkdir -p android-app/app/src/main/assets
          cp -r dist-offline android-app/app/src/main/assets/www

      # Optional: Repository-Variable APP_URL setzen → App öffnet stattdessen deine Online-Version
      - name: Live-URL (optional)
        if: ${{ vars.APP_URL != '' }}
        run: echo "${{ vars.APP_URL }}" > android-app/app/src/main/assets/live_url.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: android-app
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/release/app-release.apk social.apk

      - uses: actions/upload-artifact@v4
        with:
          name: social-apk
          path: social.apk

      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest social.apk \
            --title "@social Android-App (Offline)" \
            --notes "Komplette App inkl. Datenbank im Handy – kein Server nötig. Gebaut aus ${GITHUB_SHA::7}." \
            --latest
