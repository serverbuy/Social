<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>@social</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, Helvetica, sans-serif;
      background: linear-gradient(165deg, #3a3c44 0%, #313338 50%, #232428 100%);
      color: #f2f3f5;
    }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: #2b2d31;
      border-radius: 16px;
      padding: 32px 24px 28px;
    }
    .brand {
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.02em;
      margin: 0 0 6px;
    }
    h1 {
      font-size: 26px;
      margin: 18px 0 8px;
    }
    p { color: #b5bac1; font-size: 15px; line-height: 1.45; margin: 0 0 22px; }
    a.btn, button.btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    .primary { background: #5865f2; color: #fff; }
    input {
      width: 100%; height: 44px; border-radius: 10px; border: 1px solid #1e1f22;
      background: #1e1f22; color: #f2f3f5; padding: 0 14px; font-size: 15px; margin: 0 0 12px;
    }
    .err { color: #f23f43; font-size: 14px; margin: 12px 0 0; min-height: 1em; }
    .ghost { background: #1e1f22; color: #f2f3f5; margin-top: 10px; }
  </style>
</head>
<body>
  <main class="card">
    <p class="brand">@social</p>
    <h1>Willkommen!</h1>
    <p id="msg">Gib einmal die Adresse deiner veröffentlichten @social-Seite ein. Die App merkt sie sich und öffnet sie danach direkt.</p>
    <input id="url" type="url" inputmode="url" autocomplete="url" placeholder="https://deine-app.example.com" />
    <button class="btn primary" id="open">@social öffnen</button>
    <p id="err" class="err"></p>
  </main>
  <script>
    // Set at build time (GitHub Actions variable APP_URL). Empty = ask the user.
    var LIVE = "";
    var KEY = "social_live_url";
    function saved() { try { return localStorage.getItem(KEY) || ""; } catch (e) { return ""; } }
    function normalize(u) {
      u = (u || "").trim();
      if (!u) return "";
      if (!/^https?:\/\//i.test(u)) u = "https://" + u;
      try { return new URL(u).toString(); } catch (e) { return ""; }
    }
    var reset = location.hash === "#reset";
    var target = LIVE || (reset ? "" : saved());
    if (target) {
      location.replace(target);
    } else {
      var input = document.getElementById("url");
      input.value = saved();
      function go() {
        var u = normalize(input.value);
        if (!u) { document.getElementById("err").textContent = "Bitte eine gültige Adresse eingeben."; return; }
        try { localStorage.setItem(KEY, u); } catch (e) {}
        location.replace(u);
      }
      document.getElementById("open").addEventListener("click", go);
      input.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
    }
  </script>
</body>
</html>
