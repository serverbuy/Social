plugins {
    id 'com.android.application'
}

android {
    namespace 'app.social'
    compileSdk 34
    defaultConfig {
        applicationId "app.social"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        release {
            storeFile file("social.keystore")
            storePassword "socialapp"
            keyAlias "social"
            keyPassword "socialapp"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources { excludes += ["/META-INF/{AL2.0,LGPL2.1}"] }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:-options"
}
